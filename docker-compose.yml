services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reni
      POSTGRES_PASSWORD: reni
      POSTGRES_DB: reni_social_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reni -d reni_social_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: syncs schemas/*.yaml → postgres, then exits
  schema:
    build: .
    command: ["./schema"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: ["./api"]
    ports:
      - "1040:1040"
    volumes:
      - ./uploads:/app/uploads  # <-- ADD THIS LINE
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:1040/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: ["./worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      schema:
        condition: service_completed_successfully

volumes:
  pgdata:
