table: x_connections
columns:
  id:
    type: uuid
    primary_key: true
    not_null: true
  workspace_id:
    type: uuid
    not_null: true
  platform:
    type: varchar(50)
    not_null: true
  account_id:
    type: varchar(255)
    not_null: true
  account_name:
    type: varchar(255)
    not_null: false
  access_token:
    type: text
    not_null: true
  refresh_token:
    type: text
    not_null: false
  expires_at:
    type: timestamptz
    not_null: false
  created_at:
    type: timestamptz
    not_null: true
    default: now()

indexes:
  - name: idx_x_connections_workspace
    columns: [workspace_id]
  - name: idx_x_connections_unique
    columns: [workspace_id, account_id]
    unique: true
