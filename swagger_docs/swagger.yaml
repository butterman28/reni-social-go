basePath: /
definitions:
  auth.ActivateEmailResponse:
    properties:
      data: {}
      http_status:
        type: integer
      message:
        type: string
      status:
        type: boolean
    type: object
  auth.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/domain.User'
    type: object
  auth.CompleteRegisterResponse:
    properties:
      data: {}
      http_status:
        type: integer
      message:
        type: string
      status:
        type: boolean
    type: object
  auth.RegisterEmailResponse:
    properties:
      data: {}
      http_status:
        type: integer
      message:
        type: string
      status:
        type: boolean
    type: object
  auth.SigninResponse:
    properties:
      data: {}
      http_status:
        type: integer
      message:
        type: string
      status:
        type: boolean
    type: object
  domain.Platform:
    enum:
    - linkedin
    - meta_ig
    - meta_fb
    - x
    - tiktok
    type: string
    x-enum-comments:
      PlatformMetaFB: Facebook Page
      PlatformMetaIG: Instagram
      PlatformX: Twitter / X
    x-enum-descriptions:
    - ""
    - Instagram
    - Facebook Page
    - Twitter / X
    - ""
    x-enum-varnames:
    - PlatformLinkedIn
    - PlatformMetaIG
    - PlatformMetaFB
    - PlatformX
    - PlatformTikTok
  domain.PlatformConnection:
    properties:
      accessToken:
        type: string
      accountID:
        type: string
      accountName:
        type: string
      createdAt:
        type: string
      expiresAt:
        type: string
      id:
        type: string
      isDeleted:
        type: boolean
      needsReauth:
        type: boolean
      platform:
        $ref: '#/definitions/domain.Platform'
      reauthReason:
        type: string
      refreshToken:
        type: string
      workspaceID:
        type: string
    type: object
  domain.Post:
    properties:
      articleTitle:
        type: string
      articleURL:
        description: optional for linkedin
        type: string
      authorID:
        type: string
      content:
        type: string
      createdAt:
        type: string
      currentPublishAttemptID:
        description: '`json:"current_publish_attempt_id"`'
        type: string
      failReason:
        type: string
      id:
        type: string
      max_retries:
        type: integer
      mediaURLs:
        description: stored as JSONB in DB
        items:
          type: string
        type: array
      platforms:
        description: stored as JSONB in DB
        items:
          $ref: '#/definitions/domain.Platform'
        type: array
      publishedAt:
        type: string
      retry_count:
        type: integer
      scheduledAt:
        type: string
      status:
        $ref: '#/definitions/domain.PostStatus'
      updatedAt:
        type: string
      workspaceID:
        type: string
    type: object
  domain.PostStatus:
    enum:
    - draft
    - scheduled
    - publishing
    - published
    - failed
    type: string
    x-enum-comments:
      StatusPublishing: locked by worker — being sent
    x-enum-descriptions:
    - ""
    - ""
    - locked by worker — being sent
    - ""
    - ""
    x-enum-varnames:
    - StatusDraft
    - StatusScheduled
    - StatusPublishing
    - StatusPublished
    - StatusFailed
  domain.User:
    properties:
      address:
        type: string
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      fullname:
        type: string
      gender:
        type: string
      id:
        type: string
      is_email_verified:
        type: boolean
      last_name:
        type: string
      phone_number:
        type: string
      token:
        type: string
      username:
        type: string
    type: object
  domain.Workspace:
    properties:
      createdAt:
        type: string
      id:
        type: string
      name:
        type: string
      ownerID:
        type: string
      slug:
        type: string
    type: object
  linkedin.Client:
    type: object
  linkedin.tokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
  meta.Client:
    type: object
  meta.metaPage:
    properties:
      access_token:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  miniredis.Miniredis:
    properties:
      ctx: {}
    type: object
  platform.PublishResult:
    properties:
      containerID:
        description: Instagram container ID to poll later
        type: string
      pending:
        description: true = platform is still processing async
        type: boolean
      platformPostID:
        description: the platform's own ID for the created post
        type: string
      url:
        description: direct link to the published post (if available)
        type: string
    type: object
  scheduler.CacheResultEntry:
    properties:
      container_id:
        type: string
      created_at:
        type: string
      fail_reason:
        type: string
      id:
        type: string
      platform:
        type: string
      platform_post_id:
        type: string
      platform_post_url:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  tiktok.Client:
    type: object
  workspace.ReauthAlert:
    properties:
      account_id:
        type: string
      account_name:
        type: string
      expired:
        description: true = already dead, false = expiring soon
        type: boolean
      expires_at:
        description: for "expires in X days" countdown UI
        type: string
      platform:
        description: '"linkedin" | "meta_ig" | "meta_fb"'
        type: string
      reason:
        description: human-readable, from the monitor
        type: string
    type: object
  x.Client:
    type: object
